name: release

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    tags: ["v*"]
    branches: ["release/v0.0.3-beta"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.0.3-beta)"
        required: true
        default: "v0.0.3-beta"

permissions:
  contents: write

env:
  TAG: ${{ github.event.inputs.tag || (github.ref_type == 'branch' && 'v0.0.3-beta') || github.ref_name }}

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install audio/GUI development headers
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libjack-jackd2-dev libgl-dev libx11-xcb-dev libxcursor-dev libxcb-icccm4-dev libxcb-dri2-0-dev libxkbcommon-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace --locked
      - run: cargo xtask bundle aid_plugin --release
      - run: python packaging/build_vst3.py
      - run: python packaging/third_party_notices.py
      - run: python packaging/validate_vst3.py
      - run: cargo build -p audio-interface-diag --release --features native-audio --locked
      - run: packaging/linux/package.sh "$TAG"
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*

  windows:
    runs-on: windows-latest
    env:
      RUSTFLAGS: "-C target-feature=+crt-static"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace --locked
      - run: cargo xtask bundle aid_plugin --release
      - run: python packaging/build_vst3.py
      - run: python packaging/third_party_notices.py
      - run: python packaging/validate_vst3.py
      - run: cargo build -p audio-interface-diag --release --features native-audio --locked
      - name: Verify clean-machine runtime imports
        shell: pwsh
        run: |
          $dumpbin = Get-ChildItem "${env:ProgramFiles}\Microsoft Visual Studio\*\*\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" | Sort-Object LastWriteTime | Select-Object -Last 1
          if (-not $dumpbin) { throw "MSVC import inspection tool is unavailable" }
          $binaries = @("target/bundled/Audio Interface Diag.exe", "target/bundled/Audio Interface Diag.clap", "target/bundled/Audio Interface Diag.vst3/Contents/x86_64-win/Audio Interface Diag.vst3", "target/release/audio-interface-diag.exe")
          foreach ($binary in $binaries) {
            $imports = & $dumpbin.FullName /DEPENDENTS $binary
            if ($LASTEXITCODE -ne 0) { throw "Import inspection failed: $binary" }
            $imports
            if ($imports -match '(?i)(VCRUNTIME|MSVCP[0-9]|CONCRT)[^ ]*\.dll') { throw "Unexpected Visual C++ runtime dependency: $binary" }
          }
      - name: Portable zip
        shell: pwsh
        run: |
          $name = "AudioInterfaceDiag-$env:TAG-windows-x64-portable"
          New-Item -ItemType Directory -Force -Path "dist/$name" | Out-Null
          Copy-Item "target/bundled/Audio Interface Diag.exe" "dist/$name/"
          Copy-Item "target/bundled/Audio Interface Diag.clap" "dist/$name/"
          Copy-Item -Recurse "target/bundled/Audio Interface Diag.vst3" "dist/$name/"
          Copy-Item "target/release/audio-interface-diag.exe" "dist/$name/aid-analyze.exe"
          Copy-Item "README.md", "LICENSE", "target/bundled/THIRD-PARTY-NOTICES.txt" "dist/$name/"
          Compress-Archive -Path "dist/$name" -DestinationPath "dist/$name.zip"
          Remove-Item -Recurse "dist/$name"
      - name: Installer (Inno Setup)
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) { choco install innosetup -y --no-progress }
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc "/DAppVersion=$($env:TAG.TrimStart('v'))" "/DSrcDir=$PWD\target\bundled" "/DAnalyzerPath=$PWD\target\release\audio-interface-diag.exe" "/DOutDir=$PWD\dist" packaging\windows\installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace --locked
      - run: cargo xtask bundle aid_plugin --release
      - run: python packaging/build_vst3.py
      - run: python packaging/third_party_notices.py
      - run: python packaging/validate_vst3.py
      - run: cargo build -p audio-interface-diag --release --features native-audio --locked
      - name: Portable macOS bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/stage
          cp -R "target/bundled/Audio Interface Diag.clap" dist/stage/
          cp -R "target/bundled/Audio Interface Diag.vst3" dist/stage/
          cp -R "target/bundled/Audio Interface Diag.app" dist/stage/
          cp target/release/audio-interface-diag dist/stage/aid-analyze
          cp README.md LICENSE target/bundled/THIRD-PARTY-NOTICES.txt dist/stage/
          tar -C dist/stage -czf "dist/AudioInterfaceDiag-${TAG}-macos-${{ matrix.arch }}-portable.tar.gz" .
          rm -rf dist/stage
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: dist/*.tar.gz

  publish:
    needs: [linux, windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: ls -la dist && (cd dist && sha256sum * > SHA256SUMS.txt)
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Audio Interface Diag ${{ env.TAG }}
          prerelease: true
          draft: ${{ github.ref_type == 'branch' }}
          target_commitish: ${{ github.sha }}
          body_path: docs/release-notes-${{ env.TAG }}.md
          files: dist/*
