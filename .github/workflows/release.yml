name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.0.1-beta)"
        required: true
        default: "v0.0.1-beta"

permissions:
  contents: write

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install audio/GUI development headers
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libjack-jackd2-dev libgl-dev libx11-xcb-dev libxcursor-dev libxcb-icccm4-dev libxcb-dri2-0-dev libxkbcommon-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace
      - run: cargo xtask bundle aid_plugin --release
      - run: packaging/linux/package.sh "$TAG"
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace
      - run: cargo xtask bundle aid_plugin --release
      - name: Portable zip
        shell: pwsh
        run: |
          $name = "AudioInterfaceDiag-$env:TAG-windows-x64-portable"
          New-Item -ItemType Directory -Force -Path "dist/$name" | Out-Null
          Copy-Item "target/bundled/Audio Interface Diag.exe" "dist/$name/"
          Copy-Item "target/bundled/Audio Interface Diag.clap" "dist/$name/"
          Copy-Item -Recurse "target/bundled/Audio Interface Diag.vst3" "dist/$name/"
          Copy-Item "README.md" "dist/$name/"
          Compress-Archive -Path "dist/$name" -DestinationPath "dist/$name.zip"
          Remove-Item -Recurse "dist/$name"
      - name: Installer (Inno Setup)
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) { choco install innosetup -y --no-progress }
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc "/DAppVersion=$($env:TAG.TrimStart('v'))" "/DSrcDir=$PWD\target\bundled" "/DOutDir=$PWD\dist" packaging\windows\installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*

  publish:
    needs: [linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: ls -la dist && (cd dist && sha256sum * > SHA256SUMS.txt)
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Audio Interface Diag ${{ env.TAG }}
          prerelease: true
          body_path: docs/release-notes-v0.0.1-beta.md
          files: dist/*
